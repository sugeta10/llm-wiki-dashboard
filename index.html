<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>obsidian-vault — Knowledge Dashboard</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--surface:#161b22;--surface2:#21262d;--border:#30363d;
  --text:#e6edf3;--muted:#7d8590;--accent:#4493f8;--green:#3fb950;
  --orange:#d29922;--red:#da3633;
  --c-tools:#58a6ff;--c-concepts:#bc8cff;--c-models:#3fb950;
  --c-papers:#d29922;--c-people:#f0883e;--c-companies:#ff7b72;--c-other:#8b949e;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;line-height:1.5;min-height:100vh}
.dashboard{max-width:1080px;margin:0 auto 48px;padding:0 24px}
.dash-header{background:var(--surface);border:1px solid var(--border);border-radius:12px 12px 0 0;padding:14px 22px;display:flex;align-items:center;gap:12px}
.dash-logo{font-size:22px}
.dash-name{font-weight:600;font-size:15px}
.dash-owner{font-size:11px;color:var(--muted);margin-top:1px}
.dash-url{margin-left:auto;background:rgba(68,147,248,.1);border:1px solid rgba(68,147,248,.25);border-radius:6px;padding:5px 12px;font-family:monospace;font-size:11px;color:var(--accent)}
.stats-row{background:var(--surface);border:1px solid var(--border);border-top:none;padding:14px 22px;display:flex;align-items:center;gap:36px;border-bottom:1px solid var(--surface2)}
.stat{display:flex;align-items:baseline;gap:5px}
.stat-num{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.stat-label{font-size:12px;color:var(--muted)}
.stats-updated{margin-left:auto;font-size:11px;color:var(--muted)}
.dash-body{background:var(--surface);border:1px solid var(--border);border-top:none;border-radius:0 0 12px 12px;padding:22px}
.section-header{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.badge{background:var(--accent);color:#fff;font-size:9px;padding:1px 7px;border-radius:10px;text-transform:none;letter-spacing:0;font-weight:600}
.badge-warn{background:rgba(218,54,51,.7);color:#fff;font-size:9px;padding:1px 7px;border-radius:10px;text-transform:none;letter-spacing:0;font-weight:600}
.main-grid{display:grid;grid-template-columns:380px 1fr;gap:24px;margin-bottom:22px;align-items:start}
.activity-list{display:flex;flex-direction:column}
.activity-item{display:grid;grid-template-columns:50px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--surface2)}
.activity-item:last-child{border-bottom:none}
.activity-date{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:3px}
.activity-page{display:flex;align-items:center;gap:5px;margin-bottom:2px}
.activity-page-name{font-family:monospace;font-size:11.5px;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge-new{flex-shrink:0;background:rgba(63,185,80,.18);color:var(--green);font-size:8.5px;padding:1px 5px;border-radius:4px;font-weight:700}
.activity-desc{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.activity-source{display:inline-flex;align-items:center;gap:3px;margin-top:3px;font-size:10px;color:var(--muted);text-decoration:none;opacity:.7;transition:opacity .15s}
.activity-source:hover{opacity:1;color:var(--accent)}
.graph-wrap{background:var(--surface2);border:1px solid var(--border);border-radius:8px;overflow:hidden;position:relative}
#kgraph{display:block;width:100%;height:356px}
.graph-legend{position:absolute;bottom:10px;left:12px;display:flex;flex-wrap:wrap;gap:8px;pointer-events:none}
.leg{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--muted)}
.leg-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.graph-hint{position:absolute;top:10px;right:12px;font-size:10px;color:var(--muted);pointer-events:none}
.bottom-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px}
.cat-list{display:flex;flex-direction:column;gap:10px}
.cat-row{display:flex;align-items:center;gap:8px}
.cat-name{width:78px;font-size:12px;white-space:nowrap}
.cat-bar-bg{flex:1;background:var(--surface2);border-radius:3px;height:5px;overflow:hidden}
.cat-bar{height:100%;border-radius:3px}
.cat-count{width:22px;text-align:right;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.ref-list{display:flex;flex-direction:column;gap:9px}
.ref-row{display:flex;align-items:center;gap:8px}
.ref-rank{width:14px;font-size:10px;color:var(--muted);text-align:right}
.ref-page{font-family:monospace;font-size:11px;color:var(--accent);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ref-bar-bg{width:50px;background:var(--surface2);border-radius:3px;height:4px;overflow:hidden;flex-shrink:0}
.ref-bar{height:100%;border-radius:3px;background:var(--accent);opacity:.5}
.ref-count{width:18px;text-align:right;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.orphan-list{display:flex;flex-direction:column;gap:7px;margin-bottom:10px}
.orphan-row{display:flex;align-items:center;gap:8px;background:rgba(218,54,51,.07);border:1px solid rgba(218,54,51,.18);border-radius:6px;padding:6px 10px}
.orphan-sym{color:var(--red);font-size:10px}
.orphan-page{font-family:monospace;font-size:11px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orphan-hint{font-size:10.5px;color:var(--muted);line-height:1.5}
.dash-footer{text-align:center;padding:18px;font-size:11px;color:var(--muted);font-family:monospace}
.tooltip{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .12s;z-index:200;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.tooltip.show{opacity:1}
.tt-name{font-family:monospace;font-weight:600;color:var(--accent);margin-bottom:3px}
.tt-meta{font-size:11px;color:var(--muted)}
@media(max-width:760px){.main-grid,.bottom-grid{grid-template-columns:1fr}.stats-row{flex-wrap:wrap;gap:16px}.dash-url{display:none}}
</style>
</head>

const COLORS = {tools:'#58a6ff',concepts:'#bc8cff',models:'#3fb950',papers:'#d29922',people:'#f0883e',companies:'#ff7b72',other:'#8b949e'};
function esc(s){const t=document.createElement('div');t.textContent=String(s);return t.innerHTML;}
function pageHref(pageId){return encodeURI('pages/'+String(pageId)+'.html');}

// Stats

const sr = document.getElementById('stats-row');
const maxRef = D.top_referenced[0]?.count || 1;
sr.innerHTML = [
  `<div class="stat"><span class="stat-num">${D.stats.total_pages}</span><span class="stat-label">pages</span></div>`,

  `<div class="stat"><span class="stat-num">${D.stats.total_links}</span><span class="stat-label">links</span></div>`,

].join('');

// Activity — DOM API で構築（insertAdjacentHTML + テンプレートリテラル による XSS を防ぐ）
document.getElementById('activity-badge').textContent = `直近${D.recent_activity.length}件`;
const al = document.getElementById('activity-list');
D.recent_activity.forEach(a => {
  const item = document.createElement('div');
  item.className = 'activity-item';
  const dateD = document.createElement('div');
  dateD.className = 'activity-date';
  dateD.textContent = a.date;
  const bodyD = document.createElement('div');
  const pageD = document.createElement('div');
  pageD.className = 'activity-page';
  const nameS = document.createElement('a');
  nameS.className = 'activity-page-name';
  nameS.href = pageHref(a.page);
  nameS.textContent = a.page;
  pageD.appendChild(nameS);
  if (a.is_new) {
    const b = document.createElement('span');
    b.className = 'badge-new';
    b.textContent = 'NEW';
    pageD.appendChild(b);
  }
  const descD = document.createElement('div');
  descD.className = 'activity-desc';
  descD.textContent = a.summary;
  bodyD.appendChild(pageD);
  bodyD.appendChild(descD);
  if (a.source_url) {
    const src = document.createElement('a');
    src.className = 'activity-source';
    src.setAttribute('href', a.source_url);
    src.target = '_blank';
    src.rel = 'noopener';
    src.textContent = '↗ ' + a.source_domain;
    bodyD.appendChild(src);
  }
  item.appendChild(dateD);
  item.appendChild(bodyD);
  al.appendChild(item);
});

const maxCat = Math.max(...D.categories.map(c => c.count), 1);

// ── Force-directed graph ──
const canvas = document.getElementById('kgraph');
const wrap = canvas.parentElement;
let W = 0, H = 356;
const ctx = canvas.getContext('2d');

const nodes = D.graph.nodes.map(n => ({...n, x: 0, y: 0, vx:0, vy:0}));
const edges = D.graph.edges;
const nodeById = Object.fromEntries(nodes.map(n => [n.id, n]));
const adj = Object.fromEntries(nodes.map(n => [n.id, []]));
edges.forEach(([a,b]) => { if(adj[a]&&adj[b]){ adj[a].push(b); adj[b].push(a); }});

let hoveredId = null, frame = 0, rafId = null, prevHover = null;

function tick() {
  if (frame >= 300) return;
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i+1; j < nodes.length; j++) {
      const a=nodes[i],b=nodes[j];
      let dx=b.x-a.x, dy=b.y-a.y, d=Math.sqrt(dx*dx+dy*dy)||1;
      const f=1400/(d*d); dx/=d; dy/=d;
      a.vx-=dx*f; a.vy-=dy*f; b.vx+=dx*f; b.vy+=dy*f;
    }
  }
  edges.forEach(([aid,bid]) => {
    const a=nodeById[aid],b=nodeById[bid];
    if(!a||!b) return;
    let dx=b.x-a.x, dy=b.y-a.y, d=Math.sqrt(dx*dx+dy*dy)||1;
    const f=(d-95)*0.038; dx/=d; dy/=d;
    a.vx+=dx*f; a.vy+=dy*f; b.vx-=dx*f; b.vy-=dy*f;
  });
  nodes.forEach(n => {
    n.vx+=(W/2-n.x)*0.004; n.vy+=(H/2-n.y)*0.004;
    n.vx*=0.87; n.vy*=0.87;
    n.x=Math.max(60,Math.min(W-60,n.x+n.vx));
    n.y=Math.max(32,Math.min(H-32,n.y+n.vy));
  });
  frame++;
}

function nodeR(n) { return Math.max(5, Math.min(13, 4 + (n.degree||0)*0.8)); }
function shortLabel(s) { return s.length > 18 ? s.slice(0,17)+'…' : s; }

function draw() {
  ctx.clearRect(0,0,W,H);
  const h=hoveredId, hn=h?new Set(adj[h]||[]):null;
  edges.forEach(([aid,bid]) => {
    const a=nodeById[aid],b=nodeById[bid]; if(!a||!b) return;
    const hi=h&&(aid===h||bid===h), dim=h&&!hi;
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
    ctx.strokeStyle=hi?COLORS[(aid===h?nodeById[bid]:nodeById[aid])?.cat||'other']:'#30363d';
    ctx.globalAlpha=dim?.05:hi?.9:.55; ctx.lineWidth=hi?2:1.2; ctx.stroke();
  });
  nodes.forEach(n => {
    const r=nodeR(n), isH=n.id===h, isN=hn&&hn.has(n.id), isDim=h&&!isH&&!isN;
    ctx.globalAlpha=isDim?.15:1;
    if(isH){ctx.shadowColor=COLORS[n.cat||'other'];ctx.shadowBlur=12;}else ctx.shadowBlur=0;
    ctx.beginPath(); ctx.arc(n.x,n.y,r,0,Math.PI*2);
    ctx.fillStyle=COLORS[n.cat||'other']; ctx.fill();
    ctx.beginPath(); ctx.arc(n.x,n.y,r,0,Math.PI*2);
    ctx.strokeStyle=isH?'#fff':'#0d1117'; ctx.lineWidth=isH?2:1.5; ctx.stroke();
    ctx.shadowBlur=0;
    ctx.font='10px monospace'; ctx.textAlign='center';
    ctx.fillStyle=isDim?'#30363d':isH||isN?'#e6edf3':'#7d8590';
    ctx.globalAlpha=isDim?.15:1;
    ctx.fillText(shortLabel(n.label),n.x,n.y+r+11);
  });
  ctx.globalAlpha=1;
}

function loop() {
  tick(); draw();
  if (frame < 300) rafId = requestAnimationFrame(loop);
}

// グリッドレイアウト確定後に幅を取得して初期化
function initGraph() {
  W = wrap.clientWidth || 600;
  canvas.width = W; canvas.height = H;
  nodes.forEach(n => { n.x=W/2+(Math.random()-.5)*200; n.y=H/2+(Math.random()-.5)*200; n.vx=0; n.vy=0; });
  frame = 0;
  if (rafId) cancelAnimationFrame(rafId);
  loop();
}
requestAnimationFrame(initGraph);

const tt=document.getElementById('tooltip'),ttn=document.getElementById('tt-name'),ttm=document.getElementById('tt-meta');
canvas.addEventListener('mousemove', e => {
  const rect=canvas.getBoundingClientRect();
  const mx=(e.clientX-rect.left)*(W/rect.width), my=(e.clientY-rect.top)*(H/rect.height);
  let found=null;
  nodes.forEach(n => { const r=nodeR(n),dx=mx-n.x,dy=my-n.y; if(dx*dx+dy*dy<(r+4)*(r+4)) found=n; });
  if(found){
    hoveredId=found.id; ttn.textContent=found.id; ttm.textContent=`${found.cat||'other'} · ${found.degree||0} links`;
    tt.style.left=(e.clientX+18)+'px'; tt.style.top=(e.clientY-6)+'px'; tt.classList.add('show'); canvas.style.cursor='pointer';
  } else { hoveredId=null; tt.classList.remove('show'); canvas.style.cursor='default'; }
  if (hoveredId !== prevHover) { prevHover = hoveredId; if (frame >= 300) draw(); }
});
canvas.addEventListener('mouseleave',()=>{ hoveredId=null; tt.classList.remove('show'); if (frame >= 300) draw(); });
window.addEventListener('resize',()=>{ W=wrap.clientWidth; canvas.width=W; if (frame >= 300) draw(); });
</script>
