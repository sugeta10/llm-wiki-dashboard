  if (row.source_url) {
    const s = document.createElement('a'); s.className = 'tl-src'; s.href = row.source_url;
    s.target = '_blank'; s.rel = 'noopener'; s.textContent = '↗ ' + row.source_domain;
    body.appendChild(s);
  }
  item.appendChild(d); item.appendChild(body);
  return item;
}

function renderMore() {
  const slice = filtered.slice(shown, shown + PAGE);
  slice.forEach(row => list.appendChild(rowEl(row)));
  shown += slice.length;
  moreBtn.style.display = shown < filtered.length ? '' : 'none';
}

function applyFilter() {
  filtered = DATA.rows.filter(matches);
  shown = 0;
  list.innerHTML = '';
  countEl.textContent = filtered.length + '件';
  if (!filtered.length) {
    const e = document.createElement('div'); e.className = 'tl-empty'; e.textContent = '該当する記事がありません';
    list.appendChild(e);
    moreBtn.style.display = 'none';
    return;
  }
  renderMore();
}

DATA.categories.forEach(cat => {
  const chip = document.createElement('button'); chip.className = 'tl-chip'; chip.textContent = cat;
  chip.addEventListener('click', () => {
    if (activeCats.has(cat)) { activeCats.delete(cat); chip.classList.remove('on'); }
    else { activeCats.add(cat); chip.classList.add('on'); }
    applyFilter();
  });
  chips.appendChild(chip);
});
searchEl.addEventListener('input', () => { query = searchEl.value.trim().toLowerCase(); applyFilter(); });
moreBtn.addEventListener('click', renderMore);

applyFilter();
// この訪問で見た新着は次回消える（前回訪問以降ハイライトの基準を更新）
try { if (currentMax) localStorage.setItem(KEY, currentMax); } catch (e) {}
</script>
</main></body></html>
